set -g mouse on
set -g history-limit 50000
# New panes and sessions use Zsh after the migration.
if-shell 'command -v zsh >/dev/null 2>&1' 'set -g default-shell /usr/bin/zsh'
# Preserve the existing tmuxxer shortcut when installed.
if-shell 'test -x "$HOME/.cargo/bin/tmuxxer"' 'bind-key -n C-f display-popup -E "$HOME/.cargo/bin/tmuxxer"'
# Restrained status line, using the Bark-inspired terminal palette.
set -g status-style 'bg=default,fg=colour244'
set -g status-left '#[fg=colour180]#S #[default]'
set -g status-right '%H:%M'
setw -g window-status-current-style 'fg=colour108'
